appId: com.awapi.mindmap
productName: AwapiMindmap
copyright: Copyright © 2026 Awapi

directories:
  buildResources: ../../resources
  output: ../../release

files:
  - "out/**"
  - "!**/*.map"
  - "!**/*.test.*"
  - "!**/tsconfig*.json"
  - "!**/{.eslintrc,.prettierrc,.editorconfig}*"

# Signing is intentionally disabled for v1. Reintroduce when certificates
# are provisioned. See docs/release-process.md.
forceCodeSigning: false

mac:
  category: public.app-category.productivity
  icon: ../../resources/icon.icns
  target:
    - target: dmg
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]
  hardenedRuntime: false
  gatekeeperAssess: false
  identity: null

dmg:
  icon: ../../resources/icon.icns

win:
  icon: ../../resources/icon.ico
  target:
    - target: nsis
    - target: msi

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  artifactName: ${productName}-${version}-${arch}-setup.${ext}
  installerIcon: ../../resources/icon.ico
  uninstallerIcon: ../../resources/icon.ico
  installerHeaderIcon: ../../resources/icon.ico

msi:
  oneClick: false
  perMachine: false
  runAfterFinish: true
  artifactName: ${productName}-${version}-${arch}.${ext}

linux:
  category: Office
  maintainer: Awapi <support@awapi.com>
  icon: ../../resources/icon.png
  artifactName: ${productName}-${version}-${arch}.${ext}
  target:
    - target: AppImage
      arch: [x64, arm64]
    - target: deb
      arch: [x64, arm64]

publish:
  provider: github
  owner: awapi
  repo: awapi-mindmap
  releaseType: draft
  private: true

asarUnpack:
  - "**/*.node"

extraResources:
  - from: ../../resources/icon.png
    to: icon.png
  - from: ../../resources/icon.ico
    to: icon.ico
