<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="center" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e0e7ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Rounded square background (macOS-friendly squircle look) -->
  <rect x="64" y="64" width="896" height="896" rx="200" ry="200" fill="url(#bg)"/>

  <!-- Branch connectors -->
  <g stroke="#ffffff" stroke-width="18" stroke-linecap="round" fill="none" opacity="0.9">
    <path d="M512 512 L260 280"/>
    <path d="M512 512 L780 260"/>
    <path d="M512 512 L240 540"/>
    <path d="M512 512 L800 540"/>
    <path d="M512 512 L300 780"/>
    <path d="M512 512 L760 780"/>
  </g>

  <!-- Child nodes -->
  <g filter="url(#shadow)">
    <circle cx="260" cy="280" r="70" fill="#fde68a"/>
    <circle cx="780" cy="260" r="70" fill="#fca5a5"/>
    <circle cx="240" cy="540" r="62" fill="#a7f3d0"/>
    <circle cx="800" cy="540" r="62" fill="#c4b5fd"/>
    <circle cx="300" cy="780" r="62" fill="#fdba74"/>
    <circle cx="760" cy="780" r="62" fill="#67e8f9"/>
  </g>

  <!-- Central node -->
  <g filter="url(#shadow)">
    <circle cx="512" cy="512" r="140" fill="url(#center)" stroke="#4f46e5" stroke-width="10"/>
  </g>
</svg>
